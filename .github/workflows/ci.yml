name: CI

on:
  pull_request:
    branches: [main, local-development]
  push:
    branches: [main, local-development]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web-landing/package-lock.json
      - run: npm ci
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        working-directory: infrastructure
        run: docker compose --env-file .env.example config --quiet
